# Render Blueprint: https://render.com/docs/blueprint-spec
# Auto-deploys on every push to main.
services:
  - type: web
    name: academy-management-system
    runtime: node
    plan: free
    branch: main
    # tsx (dev dependency) runs the server, so install dev deps too
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
